name: Run Playwright tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ui
          - api

permissions:
  contents: read

jobs:
  playwright:
    name: ${{ inputs.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV: qa
      HEADLESS: "true"
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        if: ${{ inputs.suite == 'ui' || inputs.suite == 'all' }}
        run: npx playwright test "tests/UI tests"

      - name: Run API tests
        if: ${{ inputs.suite == 'api' || inputs.suite == 'all' }}
        run: npx playwright test "tests/API tests"

      - name: Generate Allure report
        if: ${{ always() }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.suite }}
          path: allure-report/
          retention-days: 14