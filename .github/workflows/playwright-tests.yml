name: Run Playwright tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ui
          - api

permissions:
  contents: read

jobs:
  playwright:
    name: ${{ inputs.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV: qa
      HEADLESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        if: ${{ inputs.suite == 'ui' || inputs.suite == 'all' }}
        run: npx playwright test "tests/UI tests"

      - name: Run API tests
        if: ${{ inputs.suite == 'api' || inputs.suite == 'all' }}
        run: npx playwright test "tests/API tests"

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
